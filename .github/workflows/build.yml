name: Build NotasIA

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
    - name: Setup Gradle 8.7
      uses: actions/setup-gradle@v4
      with:
        gradle-version: "8.7"

    - name: Build APK
      run: gradle assembleDebug --no-daemon


      - name: Build APK
        env:
          NOTAS_API_KEY: ${{ secrets.NOTAS_API_KEY }}
        run: |
          gradle wrapper --gradle-version 8.5 || true
          gradle assembleDebug --no-daemon || ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NotasIA-debug
          path: app/build/outputs/apk/debug/app-debug.apk
